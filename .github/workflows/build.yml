name: Build Android APK and AAB
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Setup Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a2a09c3757ff745582f3c05c088" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo "84831b9409646a2a09c3757ff745582f3c05c088" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" 2>/dev/null || true
          fi

      - name: Setup Workspace
        run: |
          mkdir -p www
          echo "<!DOCTYPE html><html><body>App running!</body></html>" > www/index.html
          if [ -f "source.zip" ]; then
            unzip -o source.zip -d app_source
            if [ -f "app_source/package.json" ]; then
              cd app_source
              if [ -f "package-lock.json" ]; then npm ci; else npm install --legacy-peer-deps; fi
              npm run build
              cd ..
              if [ -d "app_source/dist" ]; then cp -r app_source/dist/* www/; fi
              if [ -d "app_source/build" ]; then cp -r app_source/build/* www/; fi
            else
              cp -r app_source/* www/
            fi
          fi
          
          if [ -f ".env" ]; then
            cp .env www/
          fi

      - name: Initialize Capacitor
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps
          npm ls @capacitor/core @capacitor/cli @capacitor/android || true
          npx cap --version
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Setup Android Build Features
        run: |
          node configure_android.cjs "TXkgQUkgQXBw" "" "1" "1.0.0" "com.aistudio.app" "" || true

          # Setup Keystore
          if [ -f "existing.keystore" ]; then
            cp existing.keystore release.keystore
          else
            keytool -genkeypair -v -keystore release.keystore -storetype PKCS12 -alias myalias -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AI, OU=AI, O=AI, L=US, S=US, C=US" -storepass android123 -keypass android123
            cp release.keystore existing.keystore
          fi
          
          # Copy Keystore to Android locations
          cp release.keystore android/release.keystore
          cp release.keystore android/app/release.keystore

      - name: Generate App Icons
        run: |
          if [ -f "assets/icon.png" ]; then
            for d in android/app/src/main/res/mipmap-*; do
              if [ -d "$d" ]; then
                cp -f assets/icon.png "$d/ic_launcher.png" || true
                cp -f assets/icon.png "$d/ic_launcher_round.png" || true
                cp -f assets/icon.png "$d/ic_launcher_foreground.png" || true
              fi
            done
            mkdir -p android/app/src/main/res/drawable || true
            cp -f assets/icon.png android/app/src/main/res/drawable/ic_notification.png || true
            for d in android/app/src/main/res/drawable*; do
              if [ -d "$d" ]; then
                cp -f assets/icon.png "$d/ic_notification.png" || true
              fi
            done
          fi
          if [ -f "assets/splash.png" ]; then
            for d in android/app/src/main/res/drawable*; do
              if [ -d "$d" ]; then
                cp -f assets/splash.png "$d/splash.png" || true
              fi
            done
          fi

      - name: Compile Android APK
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sdk.dir=$ANDROID_HOME" > app/local.properties
          
          mkdir -p ../build-output
          echo "Build initiated on $(date)" > ../build-output/build-info.txt
          
          echo "=== Step 1: Building Android APK ==="
          ./gradlew assembleRelease --no-daemon --stacktrace || {
            echo "assembleRelease failed, building assembleDebug as robust fallback..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          }
          
          echo "=== Step 2: Locating, Zipaligning & Signing APK (v1, v2, v3) ==="
          RAW_APK=""
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            RAW_APK="app/build/outputs/apk/release/app-release.apk"
          elif [ -f "app/build/outputs/apk/release/app-release-unsigned.apk" ]; then
            RAW_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            RAW_APK="app/build/outputs/apk/debug/app-debug.apk"
          else
            RAW_APK=$(find app/build/outputs -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -z "$RAW_APK" ] || [ ! -f "$RAW_APK" ]; then
            echo "CRITICAL: No APK file was generated by Gradle."
            exit 1
          fi
          echo "Found raw APK: $RAW_APK"

          BUILD_TOOLS_DIR=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            BUILD_TOOLS_DIR="/usr/local/lib/android/sdk/build-tools/34.0.0"
          fi
          echo "Android Build Tools: $BUILD_TOOLS_DIR"

          KEYSTORE_PATH="../release.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            KEYSTORE_PATH="release.keystore"
          fi

          echo "Running zipalign on $RAW_APK..."
          "$BUILD_TOOLS_DIR/zipalign" -v -f -p 4 "$RAW_APK" ../build-output/app-release-aligned.apk || cp "$RAW_APK" ../build-output/app-release-aligned.apk

          echo "Signing APK with apksigner (v1, v2, v3 schemes)..."
          if [ -f "$KEYSTORE_PATH" ]; then
            "$BUILD_TOOLS_DIR/apksigner" sign --ks "$KEYSTORE_PATH" --ks-pass pass:android123 --key-pass pass:android123 --ks-key-alias myalias --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out ../build-output/app-release.apk ../build-output/app-release-aligned.apk || cp ../build-output/app-release-aligned.apk ../build-output/app-release.apk
          else
            cp ../build-output/app-release-aligned.apk ../build-output/app-release.apk
          fi

          echo "Verifying APK signature..."
          "$BUILD_TOOLS_DIR/apksigner" verify -v ../build-output/app-release.apk || true

          echo "APK successfully built & signed: ../build-output/app-release.apk"
          ls -la ../build-output/app-release.apk

          echo "=== Step 3: Compiling Android App Bundle (AAB) ==="
          ./gradlew bundleRelease --no-daemon --stacktrace || echo "AAB generation skipped or failed, APK is primary artifact."
          if [ -f "app/build/outputs/bundle/release/app-release.aab" ]; then
            cp app/build/outputs/bundle/release/app-release.aab ../build-output/app-release.aab
          fi

          if [ ! -f "../build-output/app-release.apk" ] && [ -f "$RAW_APK" ]; then
            cp "$RAW_APK" ../build-output/app-release.apk
          fi

      - name: Verify Generated Artifacts
        run: |
          ls -la build-output/
          if [ ! -f "build-output/app-release.apk" ]; then
            echo "Error: No APK was generated by the Gradle build."
            exit 1
          fi

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-release-artifacts
          path: build-output/
          if-no-files-found: error
